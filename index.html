<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>星芽遠征：深遠秘境與星界聯盟</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    :root {
      --bg: #0c121e;
      --panel: #162033;
      --panel-light: #1e2c45;
      --border: #32466b;
      --accent: #4ade80;
      --accent-dark: #16a34a;
      --gold: #fbbf24;
      --purple: #c084fc;
      --blue: #38bdf8;
      --red: #f87171;
      --text: #f1f5f9;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
      display: flex;
      flex-direction: column;
    }
    button {
      cursor: pointer;
      border: none;
      border-radius: 10px;
      font-weight: 700;
      font-family: inherit;
      transition: transform 0.1s, filter 0.15s;
    }
    button:active { transform: scale(0.96); }
    button:hover { filter: brightness(1.1); }
    button:disabled { opacity: 0.45; cursor: not-allowed; filter: none; }

    /* Top Navigation Bar */
    #top-bar {
      height: 54px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      z-index: 20;
      flex-shrink: 0;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 16px;
      font-weight: 800;
      color: var(--accent);
    }
    .currencies {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      font-weight: 700;
    }
    .curr-pill {
      background: var(--bg);
      border: 1px solid var(--border);
      padding: 4px 10px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .nav-tabs {
      display: flex;
      gap: 6px;
    }
    .nav-btn {
      background: var(--panel-light);
      color: var(--muted);
      padding: 6px 12px;
      font-size: 13px;
      border: 1px solid transparent;
    }
    .nav-btn.active {
      background: rgba(74, 222, 128, 0.15);
      color: var(--accent);
      border-color: var(--accent);
    }

    /* Screens */
    .screen {
      display: none;
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      max-width: 1200px;
      width: 100%;
      margin: 0 auto;
    }
    .screen.active { display: block; }
    #screen-battle {
      max-width: none;
      padding: 0;
      overflow: hidden;
      position: relative;
    }

    /* Lobby Layout */
    .lobby-grid {
      display: grid;
      grid-template-columns: 330px 1fr;
      gap: 16px;
    }
    @media (max-width: 820px) {
      .lobby-grid { grid-template-columns: 1fr; }
      .brand span { display: none; }
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
    }
    .card-title {
      font-size: 15px;
      font-weight: 800;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: #e2e8f0;
    }

    /* Selected Hero Showcase */
    .hero-showcase {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      background: radial-gradient(circle at top, rgba(74,222,128,0.14), transparent 70%);
      border-radius: 12px;
      padding: 12px;
      border: 1px solid var(--border);
    }
    .rarity-badge {
      font-size: 11px;
      font-weight: 800;
      padding: 2px 8px;
      border-radius: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .r-common { background: #334155; color: #cbd5e1; }
    .r-rare { background: #0369a1; color: #bae6fd; }
    .r-sr { background: #6d28d9; color: #ede9fe; }
    .r-epic { background: #b45309; color: #fef3c7; }
    .r-mythic { background: linear-gradient(90deg, #be123c, #9333ea); color: #fff; box-shadow: 0 0 10px rgba(244,63,94,0.5); }

    .skill-mini-list {
      width: 100%;
      margin-top: 10px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      text-align: left;
    }
    .skill-mini-item {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 8px;
      font-size: 11px;
    }
    .skill-mini-item b { color: var(--accent); display: block; font-size: 12px; }

    /* Equipped Items Slots */
    .equip-slots {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 8px;
    }
    .equip-slot {
      background: var(--bg);
      border: 1px dashed var(--border);
      border-radius: 10px;
      padding: 8px 6px;
      text-align: center;
      min-height: 68px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .equip-slot.filled {
      border-style: solid;
      border-color: var(--gold);
      background: rgba(251, 191, 36, 0.08);
    }

    /* Start Battle CTA */
    .btn-play {
      width: 100%;
      padding: 14px;
      font-size: 17px;
      background: linear-gradient(135deg, #22c55e, #15803d);
      color: #fff;
      box-shadow: 0 4px 16px rgba(34, 197, 94, 0.35);
      margin-top: 12px;
    }

    /* Multiplayer Box */
    .coop-box {
      background: rgba(56, 189, 248, 0.08);
      border: 1px solid rgba(56, 189, 248, 0.35);
      border-radius: 12px;
      padding: 12px;
      margin-top: 12px;
    }
    .coop-row {
      display: flex;
      gap: 6px;
      margin-top: 8px;
    }
    .coop-input {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      color: #fff;
      border-radius: 8px;
      padding: 8px 10px;
      font-weight: 700;
      text-transform: uppercase;
      font-size: 13px;
    }

    /* Roster Grid */
    .filter-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 10px;
    }
    .chip {
      background: var(--bg);
      color: var(--muted);
      border: 1px solid var(--border);
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 12px;
    }
    .chip.active {
      background: var(--accent);
      color: #052e16;
      border-color: var(--accent);
    }
    .roster-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(126px, 1fr));
      gap: 8px;
      max-height: 520px;
      overflow-y: auto;
      padding-right: 4px;
    }
    .hero-card {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px;
      text-align: center;
      cursor: pointer;
      position: relative;
      transition: border-color 0.15s, transform 0.1s;
    }
    .hero-card:hover { transform: translateY(-2px); border-color: #64748b; }
    .hero-card.selected { border: 2px solid var(--accent); background: rgba(74,222,128,0.1); }
    .hero-card.locked { opacity: 0.42; }

    /* Gacha Pools Grid */
    .pools-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 14px;
    }
    .pool-card {
      background: var(--panel);
      border: 2px solid var(--border);
      border-radius: 16px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      overflow: hidden;
    }
    .pool-cover {
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(12, 18, 30, 0.65);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px;
      padding: 10px;
      margin: 10px 0;
    }
    .pool-featured-sprite {
      width: 68px;
      height: 68px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      flex-shrink: 0;
      box-shadow: 0 0 18px rgba(251, 191, 36, 0.35);
    }
    .pool-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 8px;
    }

    /* Items Workshop Grid */
    .items-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 10px;
    }
    .item-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 8px;
    }
    .item-card.equipped {
      border-color: var(--gold);
      background: rgba(251, 191, 36, 0.08);
    }

    /* Battle HUD */
    #battle-canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    #battle-hud {
      position: absolute;
      top: 10px;
      left: 12px;
      right: 12px;
      pointer-events: none;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
    }
    .hud-box {
      background: rgba(12, 18, 30, 0.78);
      backdrop-filter: blur(4px);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 10px;
      padding: 8px 12px;
      font-size: 12px;
      pointer-events: auto;
    }
    .bar-wrap {
      width: 170px;
      height: 10px;
      background: #1e293b;
      border-radius: 999px;
      overflow: hidden;
      margin-top: 4px;
    }
    .bar-fill { height: 100%; transition: width 0.12s; }

    /* Mobile Virtual Joystick */
    #joystick-zone {
      position: absolute;
      bottom: 24px;
      left: 24px;
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: rgba(255,255,255,0.06);
      border: 2px solid rgba(255,255,255,0.16);
      display: none;
      touch-action: none;
    }
    #joystick-knob {
      position: absolute;
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: rgba(74, 222, 128, 0.55);
      top: 35px;
      left: 35px;
      pointer-events: none;
    }
    @media (pointer: coarse) {
      #joystick-zone { display: block; }
    }

    /* Modals */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(5, 8, 15, 0.82);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 16px;
    }
    .modal-backdrop.open { display: flex; }
    .modal-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      max-width: 680px;
      width: 100%;
      max-height: 88vh;
      overflow-y: auto;
      padding: 18px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.6);
    }
    .upgrade-options {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 10px;
      margin-top: 12px;
    }
    .upgrade-choice {
      background: var(--bg);
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      text-align: left;
      color: var(--text);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .upgrade-choice:hover {
      border-color: var(--accent);
      background: rgba(74, 222, 128, 0.08);
    }
    .toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: #1e293b;
      border: 1px solid var(--accent);
      color: #fff;
      padding: 10px 16px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 700;
      z-index: 200;
      opacity: 0;
      transform: translateY(10px);
      transition: all 0.25s;
      pointer-events: none;
    }
    .toast.show { opacity: 1; transform: translateY(0); }
  </style>
</head>
<body>

  <!-- Top Navigation -->
  <div id="top-bar">
    <div class="brand">🌱 <span>星芽遠征：星界聯盟</span></div>
    <div class="nav-tabs" id="main-nav">
      <button class="nav-btn active" onclick="switchTab('lobby')">⛺ 營地出戰</button>
      <button class="nav-btn" onclick="switchTab('gacha')">🌠 六大許願池</button>
      <button class="nav-btn" onclick="switchTab('items')">🎒 道具工坊</button>
    </div>
    <div class="currencies">
      <div class="curr-pill" title="金幣">🪙 <span id="ui-gold">0</span></div>
      <div class="curr-pill" title="星願招募券">🎫 <span id="ui-tickets">0</span></div>
      <button class="nav-btn" style="padding:4px 8px;font-size:11px;" onclick="claimDailyBonus()">🎁 補給</button>
    </div>
  </div>

  <!-- SCREEN 1: LOBBY & ROSTER -->
  <div id="screen-lobby" class="screen active">
    <div class="lobby-grid">
      <!-- Left Column: Selected Hero + 3 Item Slots + Co-op + Start -->
      <div>
        <div class="card">
          <div class="card-title">
            <span>出戰星芽夥伴</span>
            <span id="ui-collection-count" style="font-size:12px;color:var(--accent);">圖鑑 1/500</span>
          </div>
          <div class="hero-showcase" id="selected-hero-box"></div>

          <div style="margin-top:12px;">
            <div class="card-title" style="margin-bottom:4px;font-size:13px;">
              <span>🎒 攜帶對戰道具 (最多 3 件)</span>
              <span style="font-size:11px;color:var(--gold);cursor:pointer;" onclick="switchTab('items')">前往更換 ➔</span>
            </div>
            <div class="equip-slots" id="lobby-equip-slots"></div>
          </div>

          <button class="btn-play" onclick="startBattle(false)">⚔️ 單人進入深遠秘境</button>

          <!-- Co-op Multiplayer Section -->
          <div class="coop-box">
            <div style="font-size:13px;font-weight:800;color:var(--blue);display:flex;justify-content:space-between;">
              <span>🤝 雙人好友即時連線 (P2P)</span>
              <span id="coop-status" style="font-size:11px;color:var(--muted);">未連線</span>
            </div>
            <div class="coop-row">
              <button style="background:#0284c7;color:#fff;padding:7px 10px;font-size:12px;flex:1;" onclick="createCoopRoom()">建立房間</button>
              <input id="coop-room-input" class="coop-input" placeholder="輸入好友房號" maxlength="16" />
              <button style="background:#2563eb;color:#fff;padding:7px 10px;font-size:12px;" onclick="joinCoopRoom()">加入</button>
            </div>
            <div id="coop-room-info" style="font-size:11px;color:#bae6fd;margin-top:6px;display:none;"></div>
          </div>
        </div>
      </div>

      <!-- Right Column: 500 Heroes Roster -->
      <div class="card">
        <div class="card-title">
          <span>全 500 隻星芽圖鑑（每隻 4 個獨立招式＋專屬被動）</span>
        </div>
        <div class="filter-bar" id="roster-filters">
          <button class="chip active" data-filter="ALL" onclick="setRosterFilter('ALL', this)">全部 (500)</button>
          <button class="chip" data-filter="OWNED" onclick="setRosterFilter('OWNED', this)">已擁有</button>
          <button class="chip" data-filter="grass" onclick="setRosterFilter('grass', this)">🌿 森草</button>
          <button class="chip" data-filter="fire" onclick="setRosterFilter('fire', this)">🔥 烈焰</button>
          <button class="chip" data-filter="water" onclick="setRosterFilter('water', this)">💧 碧波</button>
          <button class="chip" data-filter="light" onclick="setRosterFilter('light', this)">✨ 聖光</button>
          <button class="chip" data-filter="dark" onclick="setRosterFilter('dark', this)">🌙 暗夜</button>
          <button class="chip" data-filter="mythic" onclick="setRosterFilter('mythic', this)">👑 神話</button>
        </div>
        <div class="roster-grid" id="roster-grid"></div>
      </div>
    </div>
  </div>

  <!-- SCREEN 2: 6 CATEGORIZED GACHA POOLS -->
  <div id="screen-gacha" class="screen">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:8px;">
      <div>
        <h2 style="font-size:18px;font-weight:800;">🌠 六大分類星願招募池</h2>
        <p style="font-size:12px;color:var(--muted);">五大元素專屬池大幅降低重複率，未擁有角色機率 ×3，每 30 抽保底史詩以上！</p>
      </div>
      <div style="font-size:12px;background:var(--panel);padding:6px 12px;border-radius:10px;border:1px solid var(--border);">
        可用金幣兌換招募券：<button style="background:var(--gold);color:#000;padding:3px 8px;font-size:11px;margin-left:6px;" onclick="buyTickets()">300 🪙 換 1 張券</button>
      </div>
    </div>
    <div class="pools-grid" id="gacha-pools-grid"></div>
  </div>

  <!-- SCREEN 3: 20 COMBAT ITEMS WORKSHOP -->
  <div id="screen-items" class="screen">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:8px;">
      <div>
        <h2 style="font-size:18px;font-weight:800;">🎒 對戰飾品道具工坊（20 種流派道具）</h2>
        <p style="font-size:12px;color:var(--muted);">開戰前可裝備最多 <b>3 件</b>常駐生效；對戰中開啟黃金補給箱還可中途替換！</p>
      </div>
      <div id="items-equipped-summary" style="font-size:12px;color:var(--gold);font-weight:700;"></div>
    </div>
    <div class="items-grid" id="items-grid"></div>
  </div>

  <!-- SCREEN 4: BATTLE CANVAS -->
  <div id="screen-battle" class="screen">
    <canvas id="battle-canvas"></canvas>

    <!-- Battle HUD -->
    <div id="battle-hud">
      <div class="hud-box">
        <div style="display:flex;align-items:center;gap:8px;">
          <b id="hud-hero-name" style="color:var(--accent);">星芽</b>
          <span id="hud-lvl" style="background:#1e293b;padding:1px 6px;border-radius:6px;">Lv.1</span>
          <span id="hud-regen" style="color:#4ade80;font-size:11px;">+0/s</span>
        </div>
        <div class="bar-wrap"><div id="hud-hp-bar" class="bar-fill" style="background:#22c55e;width:100%;"></div></div>
        <div style="font-size:11px;color:#cbd5e1;margin-top:2px;">HP: <span id="hud-hp-text">100/100</span></div>
        <div class="bar-wrap" style="height:6px;margin-top:4px;"><div id="hud-xp-bar" class="bar-fill" style="background:#38bdf8;width:0%;"></div></div>
        <div id="hud-items-row" style="display:flex;gap:4px;margin-top:6px;font-size:13px;"></div>
      </div>

      <div class="hud-box" style="text-align:center;">
        <div id="hud-biome" style="font-size:11px;color:var(--gold);font-weight:800;">🌅 晨曦星芽森林</div>
        <div id="hud-timer" style="font-size:18px;font-weight:900;letter-spacing:1px;">00:00</div>
        <div style="font-size:11px;color:var(--muted);">擊殺 <span id="hud-kills">0</span> ｜ 🪙 <span id="hud-gold">0</span></div>
      </div>

      <div class="hud-box" style="display:flex;gap:6px;">
        <button style="background:#334155;color:#fff;padding:6px 10px;font-size:12px;" onclick="togglePause()">⏸ 暫停</button>
        <button style="background:#991b1b;color:#fff;padding:6px 10px;font-size:12px;" onclick="endBattle(false)">撤退</button>
      </div>
    </div>

    <div id="joystick-zone"><div id="joystick-knob"></div></div>
  </div>

  <!-- MODAL: LEVEL UP / SUPPLY CHEST / GACHA RESULT / POOL PREVIEW -->
  <div id="modal-backdrop" class="modal-backdrop">
    <div class="modal-card" id="modal-content"></div>
  </div>

  <div id="toast" class="toast"></div>

<script>
/* ============================================================================
   1. DETERMINISTIC GENERATION OF 500 HEROES & 2,000 UNIQUE NAMED SKILLS
   ============================================================================ */
const ELEMENTS = {
  grass: { id: 'grass', name: '森草', icon: '🌿', color: '#4ade80', bg: '#064e3b' },
  fire:  { id: 'fire',  name: '烈焰', icon: '🔥', color: '#fb7185', bg: '#7f1d1d' },
  water: { id: 'water', name: '碧波', icon: '💧', color: '#38bdf8', bg: '#0c4a6e' },
  light: { id: 'light', name: '聖光', icon: '✨', color: '#fbbf24', bg: '#713f12' },
  dark:  { id: 'dark',  name: '暗夜', icon: '🌙', color: '#c084fc', bg: '#3b0764' }
};
const ELEMENT_KEYS = ['grass', 'fire', 'water', 'light', 'dark'];

const RARITIES = {
  common: { id: 'common', label: '普通', cls: 'r-common', mult: 1.0, weight: 58 },

function seededRand(seed) {
  let s = seed % 2147483647;
  if (s <= 0) s += 2147483646;
  return function() {
    s = (s * 16807) % 2147483647;
    return (s - 1) / 2147483646;
  };
}

const ALL_HEROES = [];
(function buildAll500Heroes() {
  for (let i = 1; i <= 500; i++) {
    const elemIdx = Math.floor((i - 1) / 100);
    const elemKey = ELEMENT_KEYS[elemIdx];
    const localIdx = (i - 1) % 100; // 0..99 within element
    const rng = seededRand(i * 7919 + 1337);

    // Determine rarity distribution per 100 heroes:
    // 0..2: Mythic (3 per element = 15 total), 3..11: Epic (9 per element = 45),
    // 12..29: SR (18 per element = 90), 30..59: Rare (30 per element = 150), 60..99: Common (40 per element = 200)
    let rarityKey = 'common';
    if (localIdx < 3) rarityKey = 'mythic';
    else if (localIdx < 12) rarityKey = 'epic';
    else if (localIdx < 30) rarityKey = 'sr';
    else if (localIdx < 60) rarityKey = 'rare';
    if (i === 500) rarityKey = 'mythic';

    const rarity = RARITIES[rarityKey];
    const pref = HERO_PREFIXES[elemKey][localIdx % HERO_PREFIXES[elemKey].length];
    const noun = HERO_NOUNS[Math.floor(localIdx / 5) % HERO_NOUNS.length];
    let name = `${pref}${noun}`;
    if (FEATURED_MYTHICS[elemKey] && FEATURED_MYTHICS[elemKey].id === i) {
      name = FEATURED_MYTHICS[elemKey].name;
    } else if (i === 500) {
      name = FEATURED_MYTHICS.genesis.name;
    } else if (rarityKey === 'mythic') {
      name = `${pref}神王•${noun}`;
    }

    // 4 Unique Named Skills per hero (2,000 total unique skills)
    const skills = [];
    const usedArch = new Set();
    for (let s = 0; s < 4; s++) {
      let archIdx = Math.floor(rng() * SKILL_ARCHETYPES.length);
      while (usedArch.has(archIdx)) archIdx = (archIdx + 1) % SKILL_ARCHETYPES.length;
      usedArch.add(archIdx);
      const arch = SKILL_ARCHETYPES[archIdx];
      const adj = SKILL_ADJS[elemKey][(i + s * 3) % SKILL_ADJS[elemKey].length];
      const form = SKILL_FORMS[(archIdx + s) % SKILL_FORMS.length];
      const skillName = `${adj}${form}#${i}-${s+1}`;
      const displaySkillName = `${adj}•${form}`;
      skills.push({
        uid: skillName,
        name: displaySkillName,
        archetype: arch.id,
        archLabel: arch.label,
        baseDmg: Math.round((16 + s * 4 + rng() * 6) * rarity.mult),
        cooldown: +(Math.max(0.55, 1.45 - s * 0.12 - (rarity.mult - 1) * 0.25)).toFixed(2),
        level: s === 0 ? 1 : 0
      });
    }

    // Unique Passive Talent
    const pTpl = PASSIVE_TEMPLATES[(i + elemIdx) % PASSIVE_TEMPLATES.length];
    const pVal = Math.round((6 + (rarity.mult - 1) * 18 + (i % 7)));
    const passive = {
      key: pTpl.key,
      val: pVal,
      text: `${pTpl.label}：${pTpl.fmt(pVal)}`
    };

    // Pixel Avatar DNA
    const hueShift = Math.floor(rng() * 36 - 18);
    const eyeStyle = i % 4;
    const hatStyle = i % 5;

    ALL_HEROES.push({
      id: i,
      name,
      element: elemKey,
      rarity: rarityKey,
      maxHp: Math.round(120 * rarity.mult + (localIdx % 10) * 3),
      speed: +(2.75 + (rarity.mult - 1) * 0.45).toFixed(2),
      skills,
      passive,
      dna: { hueShift, eyeStyle, hatStyle }
    });
  }
})();

const SAVE_KEY = 'star_sprout_accounts_db_v3';
let saveData = {
  gold: 1200,
  tickets: 15,
  ownedHeroes: [1, 101, 201, 301, 401],
  selectedHeroId: 1,
  ownedItems: ['jade_pendant', 'wind_boots', 'lucky_bell'],
  equippedItems: ['jade_pendant', 'wind_boots', 'lucky_bell'],
  pity: { grass: 0, fire: 0, water: 0, light: 0, dark: 0, genesis: 0 },
  lastDaily: ''
};

function loadSave() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      // Support both flat structure and nested account structure if present
      const src = parsed.currentAccount && parsed.accounts ? parsed.accounts[parsed.currentAccount] : parsed;
      if (src) {
        if (typeof src.gold === 'number') saveData.gold = src.gold;
        if (typeof src.tickets === 'number') saveData.tickets = src.tickets;
        if (Array.isArray(src.ownedHeroes) && src.ownedHeroes.length) saveData.ownedHeroes = src.ownedHeroes;
        if (src.selectedHeroId) saveData.selectedHeroId = src.selectedHeroId;
        if (Array.isArray(src.ownedItems)) saveData.ownedItems = src.ownedItems;
        if (Array.isArray(src.equippedItems)) saveData.equippedItems = src.equippedItems.slice(0, 3);
        if (src.pity) saveData.pity = { ...saveData.pity, ...src.pity };
        if (src.lastDaily) saveData.lastDaily = src.lastDaily;
      }
    }
  } catch (e) { console.warn('Save load fallback:', e); }
}

function persistSave() {
  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify(saveData));
  } catch (e) {}
  updateCurrencyUI();
}

function updateCurrencyUI() {
  document.getElementById('ui-gold').textContent = Math.floor(saveData.gold);
  document.getElementById('ui-tickets').textContent = saveData.tickets;
  document.getElementById('ui-collection-count').textContent = `圖鑑 ${saveData.ownedHeroes.length}/500`;
}

function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('show'), 2600);
}

function claimDailyBonus() {
  const today = new Date().toDateString();
  if (saveData.lastDaily === today) {
    showToast('今日星界補給已領取過囉！');
    return;
  }
  saveData.lastDaily = today;
  saveData.gold += 800;
  saveData.tickets += 10;
  persistSave();
  showToast('🎁 領取每日補給：+800 金幣、+10 張星願招募券！');
}

function drawHeroPixelCanvas(hero, size = 56) {
  const c = document.createElement('canvas');
  c.width = size;
  c.height = size;
  const ctx = c.getContext('2d');
  const el = ELEMENTS[hero.element];
  const s = size / 16;

  // Aura for high rarity
  if (hero.rarity === 'mythic' || hero.rarity === 'epic') {
    const grad = ctx.createRadialGradient(size/2, size/2, 2, size/2, size/2, size/2);
    grad.addColorStop(0, hero.rarity === 'mythic' ? 'rgba(244,63,94,0.45)' : 'rgba(251,191,36,0.35)');
    grad.addColorStop(1, 'transparent');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, size, size);
  }

  // Sprout / Crown on head
  ctx.fillStyle = hero.rarity === 'mythic' ? '#fbbf24' : el.color;
  if (hero.dna.hatStyle % 2 === 0) {
    ctx.fillRect(7*s, 1*s, 2*s, 3*s);
    ctx.fillRect(5*s, 2*s, 2*s, 1.5*s);
    ctx.fillRect(9*s, 2*s, 2*s, 1.5*s);
  } else {
    ctx.fillRect(6*s, 2*s, 4*s, 2*s);
    ctx.fillRect(7*s, 1*s, 2*s, 1*s);
  }

  // Body (rounded pixel blob)
  ctx.fillStyle = el.color;
  ctx.fillRect(4*s, 4*s, 8*s, 8*s);
  ctx.fillRect(3*s, 5*s, 10*s, 6*s);

  // Inner Belly / Face highlight
  ctx.fillStyle = '#f8fafc';
  ctx.fillRect(5*s, 6*s, 6*s, 5*s);

  // Eyes
  ctx.fillStyle = '#0f172a';
  ctx.fillRect(5.5*s, 7*s, 1.4*s, 2*s);
  ctx.fillRect(9.1*s, 7*s, 1.4*s, 2*s);

  // Cheeks
  ctx.fillStyle = '#fb7185';
  ctx.fillRect(4.5*s, 9*s, 1.2*s, 1*s);
  ctx.fillRect(10.3*s, 9*s, 1.2*s, 1*s);

  // Little feet
  ctx.fillStyle = el.bg;
  ctx.fillRect(5*s, 12*s, 2*s, 2*s);
  ctx.fillRect(9*s, 12*s, 2*s, 2*s);

  return c;
}

function renderRoster() {
  const grid = document.getElementById('roster-grid');
  grid.innerHTML = '';
  const ownedSet = new Set(saveData.ownedHeroes);

  const filtered = ALL_HEROES.filter(h => {
    if (currentRosterFilter === 'OWNED') return ownedSet.has(h.id);
    if (currentRosterFilter === 'mythic') return h.rarity === 'mythic';
    if (ELEMENT_KEYS.includes(currentRosterFilter)) return h.element === currentRosterFilter;
    return true;
  });

  // Sort owned first, then by rarity
  const rarOrder = { mythic: 0, epic: 1, sr: 2, rare: 3, common: 4 };
  filtered.sort((a, b) => {
    const ao = ownedSet.has(a.id) ? 0 : 1;
    const bo = ownedSet.has(b.id) ? 0 : 1;
    if (ao !== bo) return ao - bo;
    return rarOrder[a.rarity] - rarOrder[b.rarity] || a.id - b.id;
  });

  const frag = document.createDocumentFragment();
  filtered.forEach(hero => {
    const owned = ownedSet.has(hero.id);
    const card = document.createElement('div');
    card.className = 'hero-card' + (owned ? '' : ' locked') + (hero.id === saveData.selectedHeroId ? ' selected' : '');
    const rar = RARITIES[hero.rarity];
    const el = ELEMENTS[hero.element];
    card.innerHTML = `
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;">
        <span style="font-size:10px;color:var(--muted);">#${String(hero.id).padStart(3,'0')}</span>
        <span class="rarity-badge ${rar.cls}" style="font-size:9px;padding:1px 5px;">${rar.label}</span>
      </div>
      <div class="sprite-slot" style="display:flex;justify-content:center;"></div>
      <div style="font-size:12px;font-weight:800;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${el.icon} ${hero.name}</div>
      <div style="font-size:10px;color:var(--muted);margin-top:2px;">${owned ? '點擊出戰' : '未解鎖'}</div>
    `;
    card.querySelector('.sprite-slot').appendChild(drawHeroPixelCanvas(hero, 44));
    card.onclick = () => {
      if (!owned) {
        showToast(`尚未擁有「${hero.name}」，可前往【${el.name}卡池】許願招募！`);
        return;
      }
      saveData.selectedHeroId = hero.id;
      persistSave();
      renderSelectedHero();
      renderRoster();
    };
    frag.appendChild(card);
  });
  grid.appendChild(frag);
}

function pullGacha(poolKey, count) {
  const pool = GACHA_POOLS.find(p => p.key === poolKey);
  const totalCost = pool.cost * count;
  if (saveData.tickets < totalCost) {
    showToast(`招募券不足（需要 ${totalCost} 張），可使用金幣兌換或領取每日補給！`);
    return;
  }
  saveData.tickets -= totalCost;
  const poolHeroes = getPoolHeroes(poolKey);
  const results = [];

  for (let i = 0; i < count; i++) {
    saveData.pity[poolKey] = (saveData.pity[poolKey] || 0) + 1;
    let chosenRarity = 'common';
    const roll = Math.random() * 100;

    if (saveData.pity[poolKey] >= 30) {
      chosenRarity = Math.random() < 0.25 ? 'mythic' : 'epic';
      saveData.pity[poolKey] = 0;
    } else if (poolKey === 'genesis') {
      if (roll < 10) { chosenRarity = 'mythic'; saveData.pity[poolKey] = 0; }
      else if (roll < 35) { chosenRarity = 'epic'; saveData.pity[poolKey] = 0; }
      else chosenRarity = 'sr';
    } else {
      if (roll < 1.8) { chosenRarity = 'mythic'; saveData.pity[poolKey] = 0; }
      else if (roll < 6.5) { chosenRarity = 'epic'; saveData.pity[poolKey] = 0; }
      else if (roll < 17) chosenRarity = 'sr';
      else if (roll < 44 || (count === 10 && i === 9)) chosenRarity = 'rare';
      else chosenRarity = 'common';
    }

    const candidates = poolHeroes.filter(h => h.rarity === chosenRarity);
    // Weight unowned heroes 3x higher to prevent duplicates
    const weighted = [];
    const ownedSet = new Set(saveData.ownedHeroes);
    candidates.forEach(h => {
      const w = ownedSet.has(h.id) ? 1 : 3;
      for (let k = 0; k < w; k++) weighted.push(h);
    });
    const picked = weighted[Math.floor(Math.random() * weighted.length)] || poolHeroes[0];
    const isNew = !ownedSet.has(picked.id);
    if (isNew) {
      saveData.ownedHeroes.push(picked.id);
    } else {
      // Duplicate converts into gold refund
      saveData.gold += 80;
    }
    results.push({ hero: picked, isNew });
  }

  persistSave();
  renderGachaPools();

  const modal = document.getElementById('modal-content');
  modal.innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
      <h3 style="font-size:17px;font-weight:800;">🌠 ${pool.title} — 招募結果</h3>
      <button style="background:var(--accent);color:#052e16;padding:6px 14px;" onclick="closeModal()">太棒了！</button>
    </div>
    <div style="display:grid;grid-template-columns:repeat(auto-fill, minmax(120px, 1fr));gap:8px;">
      ${results.map(r => `
        <div style="background:var(--bg);border:1px solid ${r.isNew ? 'var(--accent)' : 'var(--border)'};border-radius:10px;padding:8px;text-align:center;">
          <span class="rarity-badge ${RARITIES[r.hero.rarity].cls}" style="font-size:9px;">${RARITIES[r.hero.rarity].label}</span>
          <div class="gacha-sprite" data-hid="${r.hero.id}" style="display:flex;justify-content:center;margin:4px 0;"></div>
          <div style="font-size:12px;font-weight:800;">${r.hero.name}</div>
          <div style="font-size:10px;color:${r.isNew ? 'var(--accent)' : 'var(--gold)'};margin-top:2px;">
            ${r.isNew ? '✨ 新夥伴加入！' : '已擁有 (+80 🪙)'}
          </div>
        </div>
      `).join('')}
    </div>
  `;
  modal.querySelectorAll('.gacha-sprite').forEach(slot => {
    const h = ALL_HEROES.find(x => x.id === Number(slot.dataset.hid));
    slot.appendChild(drawHeroPixelCanvas(h, 46));
  });
  document.getElementById('modal-backdrop').classList.add('open');
}

   ============================================================================ */
let peer = null;
let conn = null;
let isCoopHost = false;
let partnerState = null;

function createCoopRoom() {
  if (typeof Peer === 'undefined') {
    showToast('連線模組載入中，請稍候再試。');
    return;
  }
  if (peer) peer.destroy();
  const shortCode = 'STAR-' + Math.floor(1000 + Math.random() * 9000);
  document.getElementById('coop-status').textContent = '建立中...';
  peer = new Peer(shortCode);

  peer.on('open', id => {
    isCoopHost = true;
    document.getElementById('coop-status').textContent = '等待好友加入';
    document.getElementById('coop-status').style.color = '#4ade80';
    const info = document.getElementById('coop-room-info');
    info.style.display = 'block';
    info.innerHTML = `房間已建立！請將房號 <b>${id}</b> 傳給好友（好友加入後自動開始雙人遠征）`;
  });

  peer.on('connection', c => {
    conn = c;
    setupCoopConnection();
    showToast('🤝 好友已加入房間！即將進入雙人遠征！');
    setTimeout(() => startBattle(true), 800);
  });

  peer.on('error', err => {
    showToast('連線發生錯誤：' + err.type);
    document.getElementById('coop-status').textContent = '連線失敗';
  });
}

function joinCoopRoom() {
  const code = document.getElementById('coop-room-input').value.trim().toUpperCase();
  if (!code) {
    showToast('請輸入好友的房間號碼（例如 STAR-1234）');
    return;
  }
  if (peer) peer.destroy();
  document.getElementById('coop-status').textContent = '連線中...';
  peer = new Peer();

  peer.on('open', () => {
    isCoopHost = false;
    conn = peer.connect(code);
    setupCoopConnection();
    conn.on('open', () => {
      document.getElementById('coop-status').textContent = '已連線！';
      document.getElementById('coop-status').style.color = '#4ade80';
      showToast('🤝 成功連線至好友房間！');
      startBattle(true);
    });
  });

  peer.on('error', err => {
    showToast('找不到該房間或連線逾時：' + err.type);
    document.getElementById('coop-status').textContent = '未連線';
  });
}

function setupCoopConnection() {
  if (!conn) return;
  conn.on('data', data => {
    if (data.type === 'state') {
      partnerState = data;
    } else if (data.type === 'revive_ping' && battle && battle.player.downed) {
      battle.player.downed = false;
      battle.player.hp = Math.round(battle.player.maxHp * 0.5);
      spawnFloatingText(battle.player.x, battle.player.y - 24, '🤝 隊友救援復活！', '#4ade80');
    }
  });
  conn.on('close', () => {
    partnerState = null;
    document.getElementById('coop-status').textContent = '隊友已斷線';
  });
}

let battle = null;
let animFrameId = null;
const keysPressed = {};
const joyVec = { x: 0, y: 0 };

window.addEventListener('keydown', e => { keysPressed[e.key.toLowerCase()] = true; });
window.addEventListener('keyup', e => { keysPressed[e.key.toLowerCase()] = false; });

// Touch joystick setup
(function initJoystick() {
  const zone = document.getElementById('joystick-zone');
  const knob = document.getElementById('joystick-knob');
  let activeId = null;
  zone.addEventListener('touchstart', e => {
    const t = e.changedTouches[0];
    activeId = t.identifier;
    updateJoy(t);
  }, { passive: false });
  zone.addEventListener('touchmove', e => {
    e.preventDefault();
    for (let t of e.changedTouches) {
      if (t.identifier === activeId) updateJoy(t);
    }
  }, { passive: false });
  const endJoy = () => {
    activeId = null;
    joyVec.x = 0; joyVec.y = 0;
    knob.style.transform = 'translate(0px, 0px)';
  };
  zone.addEventListener('touchend', endJoy);
  zone.addEventListener('touchcancel', endJoy);

  function updateJoy(t) {
    const rect = zone.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height / 2;
    let dx = t.clientX - cx;
    let dy = t.clientY - cy;
    const dist = Math.hypot(dx, dy);
    const maxR = 40;
    if (dist > maxR) { dx = (dx / dist) * maxR; dy = (dy / dist) * maxR; }
    knob.style.transform = `translate(${dx}px, ${dy}px)`;
    joyVec.x = dx / maxR;
    joyVec.y = dy / maxR;
  }
})();

function computeEquippedStats(hero) {
  const stats = {
    regenPct: 0,      // % max HP per second (stackable via skill + items + passive)
    lifesteal: 0,
    potionBoost: 0,
    dmgReduce: 0,
    revive: 0,
    speedPct: 0,
    pickupPct: 0,
    invulnBonus: 0,
    windTrail: false,
    crateDouble: false,
    dmgPct: 0,
    cdrPct: 0,
    areaPct: 0,
    critChance: 0.05,
    slowEnemy: 0,
    extraChain: false,
    goldPct: 0,
    xpPct: 0,
    bonusCoinChance: 0,
    hpPct: 0
  };

  // Hero Passive
  const p = hero.passive;
  if (p.key === 'hp') stats.hpPct += p.val / 100;
  if (p.key === 'dmg') stats.dmgPct += p.val / 100;
  if (p.key === 'spd') stats.speedPct += p.val / 100;
  if (p.key === 'cdr') stats.cdrPct += p.val / 100;
  if (p.key === 'regen') stats.regenPct += p.val / 10;
  if (p.key === 'pickup') stats.pickupPct += (p.val * 2) / 100;
  if (p.key === 'gold') stats.goldPct += p.val / 100;
  if (p.key === 'crit') stats.critChance += p.val / 100;

  // Equipped Items (up to 3)
  (battle ? battle.activeItems : saveData.equippedItems).forEach(itemId => {
    const it = ALL_ITEMS.find(x => x.id === itemId);
    if (!it) return;
    const m = it.mod;
    for (let k in m) {
      if (typeof m[k] === 'boolean') stats[k] = stats[k] || m[k];
      else stats[k] = (stats[k] || 0) + m[k];
    }
  });

  if (battle) stats.regenPct += battle.extraRegenPct;
  return stats;
}

function startBattle(isCoop) {
  const hero = ALL_HEROES.find(h => h.id === saveData.selectedHeroId) || ALL_HEROES[0];
  document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
  document.getElementById('top-bar').style.display = 'none';
  document.getElementById('screen-battle').classList.add('active');

  const canvas = document.getElementById('battle-canvas');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  const clonedSkills = hero.skills.map((s, i) => ({
    ...s,
    level: i === 0 ? 1 : 0,
    timer: 0
  }));

  battle = {
    isCoop,
    paused: false,
    time: 0,
    kills: 0,
    goldEarned: 0,
    hero,
    sprite: drawHeroPixelCanvas(hero, 44),
    activeItems: [...saveData.equippedItems],
    extraRegenPct: 0,
    revivesUsed: 0,
    attackCounter: 0,
    windStepAcc: 0,
    potionSpawnTimer: 6,
    crateSpawnTimer: 4,
    lastSyncTimer: 0,
    player: {
      x: 0, y: 0,
      hp: hero.maxHp, maxHp: hero.maxHp,
      xp: 0, nextXp: 35, level: 1,
      invuln: 0,
      downed: false,
      reviveProgress: 0
    },
    skills: clonedSkills,
    enemies: [],
    projectiles: [],
    pickups: [],     // xp, gold, potion, chest
    crates: [],      // destructible barrels & star crystals
    particles: [],
    floatTexts: [],
    envProps: []     // trees, glowing mushrooms, pebble stones
  };

  const st = computeEquippedStats(hero);
  battle.player.maxHp = Math.round(hero.maxHp * (1 + st.hpPct));
  battle.player.hp = battle.player.maxHp;

  // Populate initial world props & destructible crates around spawn
  for (let i = 0; i < 45; i++) {
    const ang = Math.random() * Math.PI * 2;
    const dist = 140 + Math.random() * 1400;
    battle.envProps.push({
      x: Math.cos(ang) * dist,
      y: Math.sin(ang) * dist,
      type: i % 3 === 0 ? 'tree' : (i % 3 === 1 ? 'mushroom' : 'stone')
    });
  }
  for (let i = 0; i < 14; i++) spawnCrateNearPlayer();
  for (let i = 0; i < 4; i++) spawnHealthPotionNearPlayer();

  updateBattleHUD();
  let lastTs = performance.now();
  function loop(ts) {
    if (!battle) return;
    const dt = Math.min(0.05, (ts - lastTs) / 1000);
    lastTs = ts;
    if (!battle.paused) updateBattle(dt);
    renderBattle(canvas.getContext('2d'), canvas.width, canvas.height);
    animFrameId = requestAnimationFrame(loop);
  }
  animFrameId = requestAnimationFrame(loop);
}

function spawnCrateNearPlayer() {
  const ang = Math.random() * Math.PI * 2;
  const dist = 180 + Math.random() * 580;
  battle.crates.push({
    x: battle.player.x + Math.cos(ang) * dist,
    y: battle.player.y + Math.sin(ang) * dist,
    hp: 25,
    kind: Math.random() < 0.45 ? 'crystal' : 'barrel'
  });
}

function spawnHealthPotionNearPlayer() {
  const ang = Math.random() * Math.PI * 2;
  const dist = 150 + Math.random() * 480;
  battle.pickups.push({
    x: battle.player.x + Math.cos(ang) * dist,
    y: battle.player.y + Math.sin(ang) * dist,
    type: 'potion',
    val: 0.16 // 16% max HP
  });
}

function spawnFloatingText(x, y, text, color = '#fff') {
  battle.floatTexts.push({ x, y, text, color, life: 0.9 });
}

function updateBattle(dt) {
  const p = battle.player;
  const st = computeEquippedStats(battle.hero);
  battle.time += dt;

  // Passive & Stackable Health Regeneration per second
  if (!p.downed && st.regenPct > 0 && p.hp < p.maxHp) {
    const heal = p.maxHp * (st.regenPct / 100) * dt;
    p.hp = Math.min(p.maxHp, p.hp + heal);
  }

  if (p.invuln > 0) p.invuln -= dt;

  // Movement Input
  let mx = joyVec.x, my = joyVec.y;
  if (keysPressed['w'] || keysPressed['arrowup']) my -= 1;
  if (keysPressed['s'] || keysPressed['arrowdown']) my += 1;
  if (keysPressed['a'] || keysPressed['arrowleft']) mx -= 1;
  if (keysPressed['d'] || keysPressed['arrowright']) mx += 1;
  const len = Math.hypot(mx, my);
  if (len > 0 && !p.downed) {
    mx /= len; my /= len;
    const moveSpd = battle.hero.speed * 62 * (1 + st.speedPct);
    p.x += mx * moveSpd * dt;
    p.y += my * moveSpd * dt;

    // River splash micro-particles when crossing dynamic stream (around y = sin(x*0.002)*260 + 380)
    const riverY = Math.sin(p.x * 0.002) * 260 + 380;
    if (Math.abs(p.y - riverY) < 42 && Math.random() < 0.35) {
      battle.particles.push({ x: p.x, y: p.y + 12, vx: (Math.random()-0.5)*30, vy: -20, color: '#bae6fd', life: 0.45, r: 3 });
    }

    // Wind Cape item effect
    if (st.windTrail) {
      battle.windStepAcc += moveSpd * dt;
      if (battle.windStepAcc > 140) {
        battle.windStepAcc = 0;
        fireSkillProjectile({ archetype: 'homing', baseDmg: 14, name: '微風之刃' }, st, -mx, -my);
      }
    }
  }

  // Co-op Rescue Check
  if (battle.isCoop && partnerState) {
    const distToPartner = Math.hypot(p.x - partnerState.x, p.y - partnerState.y);
    if (partnerState.downed && !p.downed && distToPartner < 70) {
      p.reviveProgress += dt;
      if (p.reviveProgress >= 2.5) {
        p.reviveProgress = 0;
        if (conn && conn.open) conn.send({ type: 'revive_ping' });
        spawnFloatingText(partnerState.x, partnerState.y - 30, '✨ 成功救援隊友！', '#4ade80');
      }
    } else {
      p.reviveProgress = 0;
    }
  }

  // Natural Map Spawns: Health Potions & Destructible Crates
  battle.potionSpawnTimer -= dt * (1 + st.potionBoost * 0.5);
  if (battle.potionSpawnTimer <= 0) {
    battle.potionSpawnTimer = 11;
    spawnHealthPotionNearPlayer();
  }
  battle.crateSpawnTimer -= dt;
  if (battle.crateSpawnTimer <= 0 && battle.crates.length < 18) {
    battle.crateSpawnTimer = 6;
    spawnCrateNearPlayer();
  }

  // Enemy Spawning
  const spawnRate = Math.max(0.22, 1.15 - battle.time * 0.0035);
  battle._spawnAcc = (battle._spawnAcc || 0) + dt;
  if (battle._spawnAcc >= spawnRate && battle.enemies.length < 95) {
    battle._spawnAcc = 0;
    const isBoss = Math.floor(battle.time) > 0 && Math.floor(battle.time) % 180 === 0 && !battle._bossSpawnedAt?.[Math.floor(battle.time)];
    if (isBoss) {
      battle._bossSpawnedAt = battle._bossSpawnedAt || {};
      battle._bossSpawnedAt[Math.floor(battle.time)] = true;
    }
    const ang = Math.random() * Math.PI * 2;
    const dist = 480 + Math.random() * 140;
    const tier = 1 + battle.time / 45;
    battle.enemies.push({
      x: p.x + Math.cos(ang) * dist,
      y: p.y + Math.sin(ang) * dist,
      hp: Math.round((isBoss ? 650 : 28) * tier),
      maxHp: Math.round((isBoss ? 650 : 28) * tier),
      speed: isBoss ? 58 : (68 + Math.random() * 24),
      dmg: Math.round((isBoss ? 24 : 9) * (1 + battle.time / 180)),
      r: isBoss ? 30 : 14,
      isBoss,
      slowTimer: 0
    });
  }

  // Trigger Hero Active Skills
  if (!p.downed) {
    battle.skills.forEach(sk => {
      if (sk.level <= 0) return;
      sk.timer -= dt;
      if (sk.timer <= 0) {
        sk.timer = sk.cooldown * Math.max(0.35, 1 - st.cdrPct);
        triggerHeroSkill(sk, st);
      }
    });
  }

  // Update Projectiles
  for (let i = battle.projectiles.length - 1; i >= 0; i--) {
    const pr = battle.projectiles[i];
    pr.life -= dt;
    if (pr.life <= 0) { battle.projectiles.splice(i, 1); continue; }

    if (pr.orbit) {
      pr.angle += 4.2 * dt;
      pr.x = p.x + Math.cos(pr.angle) * pr.orbitDist;
      pr.y = p.y + Math.sin(pr.angle) * pr.orbitDist;
    } else if (pr.boomerang) {
      pr.t += dt;
      const factor = pr.t < 0.45 ? 1 : -1.15;
      pr.x += pr.vx * factor * dt;
      pr.y += pr.vy * factor * dt;
    } else {
      pr.x += pr.vx * dt;
      pr.y += pr.vy * dt;
    }

    // Check hit on destructible crates
    for (let c = battle.crates.length - 1; c >= 0; c--) {
      const cr = battle.crates[c];
      if (Math.hypot(pr.x - cr.x, pr.y - cr.y) < pr.r + 16) {
        cr.hp -= pr.dmg;
        if (cr.hp <= 0) {
          breakCrate(cr, st);
          battle.crates.splice(c, 1);
        }
        if (!pr.pierce && !pr.orbit) { pr.life = 0; break; }
      }
    }
    if (pr.life <= 0) { battle.projectiles.splice(i, 1); continue; }

    // Check hit on enemies
    for (let j = battle.enemies.length - 1; j >= 0; j--) {
      const en = battle.enemies[j];
      if (pr.hitSet && pr.hitSet.has(en)) continue;
      if (Math.hypot(pr.x - en.x, pr.y - en.y) < pr.r + en.r) {
        const isCrit = Math.random() < st.critChance;
        const finalDmg = Math.round(pr.dmg * (isCrit ? 2.0 : 1.0));
        en.hp -= finalDmg;
        if (st.slowEnemy > 0) en.slowTimer = 2.0;

        // Lifesteal item effect
        if (st.lifesteal > 0 && Math.random() < st.lifesteal && p.hp < p.maxHp) {
          p.hp = Math.min(p.maxHp, p.hp + Math.max(1, finalDmg * 0.05));
        }

        spawnFloatingText(en.x, en.y - 10, isCrit ? `💥${finalDmg}` : `${finalDmg}`, isCrit ? '#fbbf24' : '#fff');

        if (pr.hitSet) pr.hitSet.add(en);
        if (en.hp <= 0) {
          onEnemyKilled(en, st);
          battle.enemies.splice(j, 1);
        }
        if (!pr.pierce && !pr.orbit && !pr.nova) {
          pr.life = 0;
          break;
        }
      }
    }
  }

  // Update Enemies
  for (let i = battle.enemies.length - 1; i >= 0; i--) {
    const en = battle.enemies[i];
    if (en.slowTimer > 0) en.slowTimer -= dt;
    const spdMult = en.slowTimer > 0 ? (1 - st.slowEnemy) : 1;
    const ang = Math.atan2(p.y - en.y, p.x - en.x);
    en.x += Math.cos(ang) * en.speed * spdMult * dt;
    en.y += Math.sin(ang) * en.speed * spdMult * dt;

    // Player collision damage
    if (!p.downed && p.invuln <= 0 && Math.hypot(p.x - en.x, p.y - en.y) < en.r + 14) {
      const taken = Math.max(1, Math.round(en.dmg * (1 - st.dmgReduce)));
      p.hp -= taken;
      p.invuln = 0.55 + st.invulnBonus;
      spawnFloatingText(p.x, p.y - 20, `-${taken}`, '#f87171');

      if (p.hp <= 0) {
        if (st.revive > battle.revivesUsed) {
          battle.revivesUsed++;
          p.hp = Math.round(p.maxHp * 0.5);
          p.invuln = 2.0;
          spawnFloatingText(p.x, p.y - 30, '🪶 不死鳥浴火重生！', '#fbbf24');
          // Knockback nearby enemies
          battle.enemies.forEach(e2 => {
            const a2 = Math.atan2(e2.y - p.y, e2.x - p.x);
            e2.x += Math.cos(a2) * 140;
            e2.y += Math.sin(a2) * 140;
          });
        } else if (battle.isCoop && partnerState && !partnerState.downed) {
          p.hp = 0;
          p.downed = true;
          spawnFloatingText(p.x, p.y - 24, '💫 倒地！等待隊友靠近救援...', '#38bdf8');
        } else {
          endBattle(false);
          return;
        }
      }
    }
  }

  // Update Pickups (Magnet & Collection)
  const magnetRange = 75 * (1 + st.pickupPct);
  for (let i = battle.pickups.length - 1; i >= 0; i--) {
    const pk = battle.pickups[i];
    const d = Math.hypot(p.x - pk.x, p.y - pk.y);
    if (d < magnetRange) {
      const a = Math.atan2(p.y - pk.y, p.x - pk.x);
      pk.x += Math.cos(a) * 320 * dt;
      pk.y += Math.sin(a) * 320 * dt;
    }
    if (d < 22 && !p.downed) {
      if (pk.type === 'xp') {
        p.xp += pk.val * (1 + st.xpPct);
        if (p.xp >= p.nextXp) {
          p.xp -= p.nextXp;
          p.level++;
          p.nextXp = Math.round(p.nextXp * 1.28);
          openLevelUpModal();
        }
      } else if (pk.type === 'gold') {
        const g = Math.round(pk.val * (1 + st.goldPct));
        battle.goldEarned += g;
        spawnFloatingText(p.x, p.y - 16, `+${g} 🪙`, '#fbbf24');
      } else if (pk.type === 'potion') {
        const healAmt = Math.round(p.maxHp * pk.val * (1 + st.potionBoost));
        p.hp = Math.min(p.maxHp, p.hp + healAmt);
        spawnFloatingText(p.x, p.y - 18, `+${healAmt} HP 🧪`, '#4ade80');
      } else if (pk.type === 'chest') {
        openSupplyChestModal();
      }
      battle.pickups.splice(i, 1);
    }
  }

  // Update Particles & Floating Texts
  for (let i = battle.particles.length - 1; i >= 0; i--) {
    const pt = battle.particles[i];
    pt.life -= dt;
    pt.x += pt.vx * dt; pt.y += pt.vy * dt;
    if (pt.life <= 0) battle.particles.splice(i, 1);
  }
  for (let i = battle.floatTexts.length - 1; i >= 0; i--) {
    const ft = battle.floatTexts[i];
    ft.life -= dt;
    ft.y -= 28 * dt;
    if (ft.life <= 0) battle.floatTexts.splice(i, 1);
  }

  // Sync P2P Co-op State
  if (battle.isCoop && conn && conn.open) {
    battle.lastSyncTimer += dt;
    if (battle.lastSyncTimer >= 0.06) {
      battle.lastSyncTimer = 0;
      conn.send({
        type: 'state',
        x: p.x, y: p.y,
        hp: p.hp, maxHp: p.maxHp,
        downed: p.downed,
        heroId: battle.hero.id
      });
    }
  }

  updateBattleHUD();
}

function getNearestEnemy(x, y) {
  let best = null, bestD = Infinity;
  for (let en of battle.enemies) {
    const d = Math.hypot(en.x - x, en.y - y);
    if (d < bestD) { bestD = d; best = en; }
  }
  return best;
}

function triggerHeroSkill(sk, st) {
  const p = battle.player;
  battle.attackCounter++;
  const dmg = Math.round(sk.baseDmg * (1 + (sk.level - 1) * 0.35) * (1 + st.dmgPct));
  const area = 1 + st.areaPct;
  const color = ELEMENTS[battle.hero.element].color;
  const target = getNearestEnemy(p.x, p.y);
  const baseAng = target ? Math.atan2(target.y - p.y, target.x - p.x) : Math.random() * Math.PI * 2;

  // Thunder Core extra chain lightning every 5 attacks
  if (st.extraChain && battle.attackCounter % 5 === 0 && target) {
    battle.projectiles.push({
      x: target.x, y: target.y, vx: 0, vy: 0,
      r: 42 * area, dmg: Math.round(dmg * 0.8), color: '#fde047',
      life: 0.25, nova: true, hitSet: new Set()
    });
  }

  switch (sk.archetype) {
    case 'spread':
      for (let k = -1; k <= 1; k++) {
        const a = baseAng + k * 0.24;
        battle.projectiles.push({ x: p.x, y: p.y, vx: Math.cos(a)*360, vy: Math.sin(a)*360, r: 7*area, dmg, color, life: 1.1 });
      }
      break;
    case 'orbit':
      for (let k = 0; k < 2 + Math.floor(sk.level/2); k++) {
        battle.projectiles.push({
          x: p.x, y: p.y, vx: 0, vy: 0, r: 10*area, dmg: Math.round(dmg*0.75), color,
          life: 1.3, orbit: true, angle: (Math.PI * 2 / 3) * k, orbitDist: 64 * area, hitSet: new Set()
        });
      }
      break;
    case 'nova':
    case 'vortex':
    case 'drain':
      battle.projectiles.push({
        x: p.x, y: p.y, vx: 0, vy: 0, r: 72 * area, dmg, color,
        life: 0.32, nova: true, hitSet: new Set()
      });
      if (sk.archetype === 'drain' && p.hp < p.maxHp) {
        p.hp = Math.min(p.maxHp, p.hp + 2);
      }
      break;
    case 'meteor':
    case 'rain':
      const tx = target ? target.x + (Math.random()-0.5)*70 : p.x + Math.cos(baseAng)*140;
      const ty = target ? target.y + (Math.random()-0.5)*70 : p.y + Math.sin(baseAng)*140;
      battle.projectiles.push({
        x: tx, y: ty, vx: 0, vy: 0, r: 46 * area, dmg: Math.round(dmg*1.25), color,
        life: 0.35, nova: true, hitSet: new Set()
      });
      break;
    case 'pierce':
    case 'slash':
      battle.projectiles.push({
        x: p.x, y: p.y, vx: Math.cos(baseAng)*440, vy: Math.sin(baseAng)*440,
        r: (sk.archetype === 'slash' ? 22 : 10) * area, dmg, color,
        life: 0.9, pierce: true, hitSet: new Set()
      });
      break;
    case 'boomerang':
      battle.projectiles.push({
        x: p.x, y: p.y, vx: Math.cos(baseAng)*340, vy: Math.sin(baseAng)*340,
        r: 12 * area, dmg, color, life: 1.0, boomerang: true, t: 0, hitSet: new Set()
      });
      break;
    default: // homing & chain
      battle.projectiles.push({
        x: p.x, y: p.y, vx: Math.cos(baseAng)*390, vy: Math.sin(baseAng)*390,
        r: 8 * area, dmg, color, life: 1.2
      });
  }
}

function fireSkillProjectile(sk, st, dx, dy) {
  const p = battle.player;
  const a = Math.atan2(dy, dx);
  battle.projectiles.push({
    x: p.x, y: p.y, vx: Math.cos(a)*340, vy: Math.sin(a)*340,
    r: 8, dmg: sk.baseDmg, color: '#a7f3d0', life: 1.0
  });
}

function breakCrate(cr, st) {
  const mult = st.crateDouble ? 2 : 1;
  spawnFloatingText(cr.x, cr.y - 10, cr.kind === 'crystal' ? '💎 星晶碎裂！' : '📦 木桶開啟！', '#38bdf8');
  for (let i = 0; i < mult; i++) {
    if (Math.random() < 0.45) {
      battle.pickups.push({ x: cr.x + i*12, y: cr.y, type: 'potion', val: 0.16 });
    } else {
      battle.pickups.push({ x: cr.x + i*12, y: cr.y, type: 'gold', val: 15 });
    }
  }
}

function onEnemyKilled(en, st) {
  battle.kills++;
  battle.pickups.push({ x: en.x, y: en.y, type: 'xp', val: en.isBoss ? 120 : 10 });

  if (en.isBoss) {
    battle.pickups.push({ x: en.x + 15, y: en.y, type: 'chest' });
    battle.pickups.push({ x: en.x - 15, y: en.y, type: 'gold', val: 120 });
  } else {
    if (Math.random() < 0.25 + st.bonusCoinChance) {
      battle.pickups.push({ x: en.x + 6, y: en.y, type: 'gold', val: Math.random() < st.bonusCoinChance ? 18 : 6 });
    }
    // Map health potion drop from monsters so players stay healthy
    if (Math.random() < 0.065 * (1 + st.potionBoost)) {
      battle.pickups.push({ x: en.x - 6, y: en.y, type: 'potion', val: 0.15 });
    }
  }
}

/* ============================================================================
   10. MULTI-LAYER DYNAMIC WORLD RENDERING (MORNING / DUSK / STARLIGHT NIGHT)
   ============================================================================ */
function renderBattle(ctx, w, h) {
  const p = battle.player;
  const cx = w / 2 - p.x;
  const cy = h / 2 - p.y;

  // Dynamic Biome / Time-of-Day Cycle (0-180s Morning Forest, 180-360s Amber Dusk, 360s+ Starlight Night)
  let groundColor = '#143326';
  let gridColor = 'rgba(74, 222, 128, 0.07)';
  let biomeLabel = '🌅 晨曦星芽森林';
  let isNight = false;

  if (battle.time >= 360) {
    groundColor = '#0c1326';
    gridColor = 'rgba(129, 140, 248, 0.09)';
    biomeLabel = '🌌 星夜深遠秘境';
    isNight = true;
  } else if (battle.time >= 180) {
    groundColor = '#2b1e16';
    gridColor = 'rgba(251, 146, 60, 0.08)';
    biomeLabel = '🌇 暮光琥珀荒野';
  }
  document.getElementById('hud-biome').textContent = biomeLabel;

  ctx.fillStyle = groundColor;
  ctx.fillRect(0, 0, w, h);

  ctx.save();
  ctx.translate(cx, cy);

  // Subtle tile grid & cobblestone path
  const tile = 96;
  const startX = Math.floor((p.x - w/2) / tile) * tile;
  const endX = p.x + w/2 + tile;
  const startY = Math.floor((p.y - h/2) / tile) * tile;
  const endY = p.y + h/2 + tile;

  ctx.strokeStyle = gridColor;
  ctx.lineWidth = 1;
  for (let gx = startX; gx <= endX; gx += tile) {
    ctx.beginPath(); ctx.moveTo(gx, startY); ctx.lineTo(gx, endY); ctx.stroke();
  }
  for (let gy = startY; gy <= endY; gy += tile) {
    ctx.beginPath(); ctx.moveTo(startX, gy); ctx.lineTo(endX, gy); ctx.stroke();
  }

  // Flowing Winding Stream
  ctx.strokeStyle = isNight ? 'rgba(56, 189, 248, 0.28)' : 'rgba(56, 189, 248, 0.36)';
  ctx.lineWidth = 68;
  ctx.lineCap = 'round';
  ctx.beginPath();
  for (let rx = startX - 100; rx <= endX + 100; rx += 60) {
    const ry = Math.sin(rx * 0.002) * 260 + 380;
    if (rx === startX - 100) ctx.moveTo(rx, ry);
    else ctx.lineTo(rx, ry);
  }
  ctx.stroke();

  // Environment Props (Trees, Glowing Mushrooms, Stones)
  battle.envProps.forEach(pr => {
    if (Math.abs(pr.x - p.x) > w/2 + 80 || Math.abs(pr.y - p.y) > h/2 + 80) return;
    if (pr.type === 'tree') {
      ctx.fillStyle = 'rgba(0,0,0,0.28)';
      ctx.beginPath(); ctx.ellipse(pr.x, pr.y + 16, 22, 10, 0, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#78350f';
      ctx.fillRect(pr.x - 5, pr.y - 4, 10, 20);
      ctx.fillStyle = isNight ? '#1e3a8a' : '#15803d';
      ctx.beginPath(); ctx.arc(pr.x, pr.y - 14, 22, 0, Math.PI*2); ctx.fill();
    } else if (pr.type === 'mushroom') {
      ctx.fillStyle = isNight ? '#c084fc' : '#f472b6';
      if (isNight) {
        ctx.shadowColor = '#c084fc';
        ctx.shadowBlur = 12;
      }
      ctx.beginPath(); ctx.arc(pr.x, pr.y, 7, Math.PI, 0); ctx.fill();
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#f8fafc';
      ctx.fillRect(pr.x - 2, pr.y, 4, 6);
    } else {
      ctx.fillStyle = 'rgba(148, 163, 184, 0.25)';
      ctx.beginPath(); ctx.ellipse(pr.x, pr.y, 12, 7, 0, 0, Math.PI*2); ctx.fill();
    }
  });

  // Destructible Crates & Star Crystals
  battle.crates.forEach(cr => {
    if (cr.kind === 'crystal') {
      ctx.fillStyle = '#38bdf8';
      ctx.beginPath();
      ctx.moveTo(cr.x, cr.y - 16);
      ctx.lineTo(cr.x + 12, cr.y);
      ctx.lineTo(cr.x, cr.y + 16);
      ctx.lineTo(cr.x - 12, cr.y);
      ctx.closePath();
      ctx.fill();
    } else {
      ctx.fillStyle = '#b45309';
      ctx.fillRect(cr.x - 12, cr.y - 12, 24, 24);
      ctx.strokeStyle = '#fef3c7';
      ctx.lineWidth = 2;
      ctx.strokeRect(cr.x - 12, cr.y - 12, 24, 24);
    }
  });

  // Pickups (XP, Gold, Health Potions, Supply Chests)
  battle.pickups.forEach(pk => {
    if (pk.type === 'xp') {
      ctx.fillStyle = '#38bdf8';
      ctx.beginPath(); ctx.arc(pk.x, pk.y, 4.5, 0, Math.PI*2); ctx.fill();
    } else if (pk.type === 'gold') {
      ctx.fillStyle = '#fbbf24';
      ctx.beginPath(); ctx.arc(pk.x, pk.y, 6, 0, Math.PI*2); ctx.fill();
    } else if (pk.type === 'potion') {
      // Glowing Stardew Health Potion
      ctx.fillStyle = 'rgba(74, 222, 128, 0.25)';
      ctx.beginPath(); ctx.arc(pk.x, pk.y, 14, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#22c55e';
      ctx.beginPath(); ctx.arc(pk.x, pk.y + 2, 8, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#f8fafc';
      ctx.fillRect(pk.x - 3, pk.y - 9, 6, 4);
    } else if (pk.type === 'chest') {
      ctx.fillStyle = '#f59e0b';
      ctx.fillRect(pk.x - 14, pk.y - 11, 28, 22);
      ctx.strokeStyle = '#fff';
      ctx.strokeRect(pk.x - 14, pk.y - 11, 28, 22);
    }
  });

  // Enemies
  battle.enemies.forEach(en => {
    ctx.fillStyle = en.isBoss ? '#e11d48' : (en.slowTimer > 0 ? '#38bdf8' : '#f97316');
    ctx.beginPath(); ctx.arc(en.x, en.y, en.r, 0, Math.PI*2); ctx.fill();
    // Eyes
    ctx.fillStyle = '#fff';
    ctx.fillRect(en.x - en.r*0.45, en.y - en.r*0.2, 4, 4);
    ctx.fillRect(en.x + en.r*0.2, en.y - en.r*0.2, 4, 4);
    if (en.isBoss) {
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(en.x - 24, en.y - en.r - 12, 48, 5);
      ctx.fillStyle = '#f43f5e';
      ctx.fillRect(en.x - 24, en.y - en.r - 12, 48 * Math.max(0, en.hp / en.maxHp), 5);
    }
  });

  // Projectiles
  battle.projectiles.forEach(pr => {
    ctx.fillStyle = pr.color;
    if (pr.nova) {
      ctx.globalAlpha = Math.max(0.15, pr.life * 2);
      ctx.beginPath(); ctx.arc(pr.x, pr.y, pr.r, 0, Math.PI*2); ctx.fill();
      ctx.globalAlpha = 1;
    } else {
      ctx.beginPath(); ctx.arc(pr.x, pr.y, pr.r, 0, Math.PI*2); ctx.fill();
    }
  });

  // Co-op Partner Sprite
  if (battle.isCoop && partnerState) {
    const pHero = ALL_HEROES.find(h => h.id === partnerState.heroId) || ALL_HEROES[1];
    if (!partnerState._sprite) partnerState._sprite = drawHeroPixelCanvas(pHero, 44);
    ctx.globalAlpha = partnerState.downed ? 0.45 : 1;
    ctx.drawImage(partnerState._sprite, partnerState.x - 22, partnerState.y - 22);
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#38bdf8';
    ctx.font = 'bold 11px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(partnerState.downed ? '💫 隊友倒地(靠近救援)' : '🤝 好友隊友', partnerState.x, partnerState.y - 28);
  }

  // Player Sprite
  if (p.invuln <= 0 || Math.floor(p.invuln * 16) % 2 === 0) {
    ctx.globalAlpha = p.downed ? 0.45 : 1;
    ctx.drawImage(battle.sprite, p.x - 22, p.y - 22);
    ctx.globalAlpha = 1;
  }

  // Ambient Fireflies / Petals
  for (let f = 0; f < 16; f++) {
    const fx = p.x + Math.sin(battle.time * 0.7 + f * 1.9) * (w * 0.45);
    const fy = p.y + Math.cos(battle.time * 0.5 + f * 2.3) * (h * 0.45);
    ctx.fillStyle = isNight ? 'rgba(250, 204, 21, 0.65)' : 'rgba(255, 255, 255, 0.35)';
    ctx.beginPath(); ctx.arc(fx, fy, isNight ? 2.5 : 2, 0, Math.PI*2); ctx.fill();
  }

  // Particles & Floating Texts
  battle.particles.forEach(pt => {
    ctx.fillStyle = pt.color;
    ctx.beginPath(); ctx.arc(pt.x, pt.y, pt.r, 0, Math.PI*2); ctx.fill();
  });
  battle.floatTexts.forEach(ft => {
    ctx.fillStyle = ft.color;
    ctx.font = 'bold 13px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(ft.text, ft.x, ft.y);
  });

  ctx.restore();
}

function updateBattleHUD() {
  const p = battle.player;
  const st = computeEquippedStats(battle.hero);
  document.getElementById('hud-hero-name').textContent = battle.hero.name;
  document.getElementById('hud-lvl').textContent = `Lv.${p.level}`;
  document.getElementById('hud-regen').textContent = st.regenPct > 0 ? `+${st.regenPct.toFixed(1)}%/s` : '';
  document.getElementById('hud-hp-bar').style.width = `${Math.max(0, (p.hp / p.maxHp) * 100)}%`;
  document.getElementById('hud-hp-text').textContent = `${Math.ceil(p.hp)}/${p.maxHp}`;
  document.getElementById('hud-xp-bar').style.width = `${Math.min(100, (p.xp / p.nextXp) * 100)}%`;

  const mins = String(Math.floor(battle.time / 60)).padStart(2, '0');
  const secs = String(Math.floor(battle.time % 60)).padStart(2, '0');
  document.getElementById('hud-timer').textContent = `${mins}:${secs}`;
  document.getElementById('hud-kills').textContent = battle.kills;
  document.getElementById('hud-gold').textContent = battle.goldEarned;

  document.getElementById('hud-items-row').innerHTML = battle.activeItems.map(id => {
    const it = ALL_ITEMS.find(x => x.id === id);
    return it ? `<span title="${it.name}: ${it.desc}">${it.icon}</span>` : '';
  }).join('');
}

/* ============================================================================
   11. LEVEL-UP CARDS (INCLUDING STACKABLE HEALTH REGEN) & SUPPLY CHEST SWAP
   ============================================================================ */
function openLevelUpModal() {
  battle.paused = true;
  const choices = [];

  // Offer Hero's 4 unique skills
  battle.skills.forEach((sk, idx) => {
    choices.push({
      title: sk.level === 0 ? `✨ 解鎖新招式：${sk.name}` : `⬆️ 強化：${sk.name} (Lv.${sk.level+1})`,
      desc: `${sk.archLabel}｜基礎威力提升至 ${Math.round(sk.baseDmg * (1 + sk.level * 0.35))}`,
      apply: () => { sk.level++; }
    });
  });

  // Stackable Health Regen Card (🌿 生命律動)
  choices.push({
    title: '🌿 生命律動（可無限疊加）',
    desc: `每秒額外回復 +1.2% 最大生命值（目前疊加：+${(battle.extraRegenPct + 1.2).toFixed(1)}%/s）`,
    apply: () => { battle.extraRegenPct += 1.2; }
  });

  // Max HP + Immediate Heal Card
  choices.push({
    title: '💖 星芽生命綻放',
    desc: '最大生命值 +20%，並立即回復 30% 生命值',
    apply: () => {
      battle.player.maxHp = Math.round(battle.player.maxHp * 1.2);
      battle.player.hp = Math.min(battle.player.maxHp, battle.player.hp + battle.player.maxHp * 0.3);
    }
  });

  // Pick 3 random options
  const picked = choices.sort(() => Math.random() - 0.5).slice(0, 3);
  const modal = document.getElementById('modal-content');
  modal.innerHTML = `
    <h3 style="font-size:18px;font-weight:900;color:var(--accent);">⬆️ 角色升級（Lv.${battle.player.level}）— 選擇一項強化</h3>
    <div class="upgrade-options">
      ${picked.map((c, idx) => `
        <button class="upgrade-choice" onclick="selectLevelChoice(${idx})">
          <b style="font-size:14px;color:var(--gold);">${c.title}</b>
          <span style="font-size:12px;color:#cbd5e1;line-height:1.4;">${c.desc}</span>
        </button>
      `).join('')}
    </div>
  `;
  window._pendingLevelChoices = picked;
  document.getElementById('modal-backdrop').classList.add('open');
}

function selectLevelChoice(idx) {
  const ch = window._pendingLevelChoices[idx];
  if (ch) ch.apply();
  closeModal();
  battle.paused = false;
}

function openSupplyChestModal() {
  battle.paused = true;
  const randomNewItem = ALL_ITEMS[Math.floor(Math.random() * ALL_ITEMS.length)];
  const modal = document.getElementById('modal-content');
  modal.innerHTML = `
    <h3 style="font-size:18px;font-weight:900;color:var(--gold);">📦 開啟黃金補給箱！</h3>
    <p style="font-size:13px;color:#cbd5e1;margin-top:6px;">
      發現新對戰道具：<b>${randomNewItem.icon} ${randomNewItem.name}</b>（${randomNewItem.desc}）
    </p>
    <p style="font-size:12px;color:var(--muted);margin-top:4px;">你可以選擇直接裝上（若已滿 3 格可替換其中 1 件），或直接兌換成 120 金幣：</p>
    <div style="display:flex;flex-direction:column;gap:8px;margin-top:12px;">
      ${battle.activeItems.length < 3
        ? `<button style="background:var(--accent);color:#052e16;padding:10px;" onclick="equipChestItem('${randomNewItem.id}', -1)">＋ 直接放入空道具槽</button>`
        : battle.activeItems.map((oldId, slotIdx) => {
            const oldIt = ALL_ITEMS.find(x => x.id === oldId);
            return `<button style="background:var(--panel-light);color:#fff;padding:10px;border:1px solid var(--border);" onclick="equipChestItem('${randomNewItem.id}', ${slotIdx})">
              替換槽位 ${slotIdx+1}：【${oldIt.icon} ${oldIt.name}】 ➔ 【${randomNewItem.icon} ${randomNewItem.name}】
            </button>`;
          }).join('')
      }
      <button style="background:var(--gold);color:#000;padding:10px;" onclick="chestTakeGold()">🪙 不替換，直接領取 +120 金幣</button>
    </div>
  `;
  document.getElementById('modal-backdrop').classList.add('open');
}

function equipChestItem(newId, replaceIdx) {
  if (replaceIdx === -1) battle.activeItems.push(newId);
  else battle.activeItems[replaceIdx] = newId;
  closeModal();
  battle.paused = false;
  showToast('🎒 已在對戰中裝備新道具！');
}

function chestTakeGold() {
  battle.goldEarned += 120;
  closeModal();
  battle.paused = false;
}

function togglePause() {
  if (!battle) return;
  battle.paused = !battle.paused;
  showToast(battle.paused ? '⏸ 遊戲已暫停' : '▶️ 繼續遠征');
}

function endBattle(victory) {
  if (!battle) return;
  cancelAnimationFrame(animFrameId);
  const earnedGold = battle.goldEarned + Math.floor(battle.time * 0.8);
  const earnedTickets = Math.floor(battle.time / 120);
  saveData.gold += earnedGold;
  saveData.tickets += earnedTickets;
  persistSave();

  const summary = {
    time: Math.floor(battle.time),
    kills: battle.kills,
    gold: earnedGold,
    tickets: earnedTickets
  };
  battle = null;

  document.getElementById('screen-battle').classList.remove('active');
  document.getElementById('top-bar').style.display = 'flex';
  switchTab('lobby');

  const modal = document.getElementById('modal-content');
  modal.innerHTML = `
    <h3 style="font-size:20px;font-weight:900;color:var(--gold);">🏁 星芽遠征結算</h3>
    <div style="margin-top:12px;display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:14px;">
      <div class="card">存活時間：<b>${Math.floor(summary.time/60)}分 ${summary.time%60}秒</b></div>
      <div class="card">擊敗魔物：<b>${summary.kills} 隻</b></div>
      <div class="card" style="color:var(--gold);">獲得金幣：<b>+${summary.gold} 🪙</b></div>
      <div class="card" style="color:var(--accent);">獲得招募券：<b>+${summary.tickets} 🎫</b></div>
    </div>
    <button style="width:100%;margin-top:14px;background:var(--accent);color:#052e16;padding:12px;font-size:15px;" onclick="closeModal()">返回星芽營地</button>
  `;
  document.getElementById('modal-backdrop').classList.add('open');
}

/* ============================================================================
   12. BOOTSTRAP
   ============================================================================ */
loadSave();
updateCurrencyUI();
renderSelectedHero();
renderLobbyEquipSlots();
renderRoster();
</script>
</body>
